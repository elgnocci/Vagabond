name: Compilar app Android

on:
  push:
    branches: [main, claude/atomic-habits-app-ud1rfx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # La llave de firma vive en los secretos del repo, nunca en el código.
      - name: Preparar la llave de firma
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/vagabond.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64. Se compila una versión de prueba que no se debe instalar."
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK firmado
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          VAGABOND_KEYSTORE_FILE: ${{ runner.temp }}/vagabond.jks
          VAGABOND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${{ steps.key.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk ../vagabond.apk

      - name: Compilar versión de prueba (sin llave)
        if: steps.key.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vagabond-apk
          path: vagabond.apk

      # En main, además se publica como descarga directa en la página de Releases.
      - name: Publicar en Releases
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Vagabond para Android" \
            --notes "Descarga vagabond.apk e instálalo en tu teléfono. Se actualiza solo con cada cambio en main."
          gh release upload android vagabond.apk --clobber
